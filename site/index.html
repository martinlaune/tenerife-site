<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tenerife 2026 — Carnet de la famille</title>
<meta name="description" content="Le programme complet de nos vacances à Tenerife.">
<meta name="theme-color" content="#2AA6C9">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tenerife">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
<script>
if("serviceWorker" in navigator){navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(reg){reg.unregister()})});if(typeof caches!=="undefined"){caches.keys().then(function(k){k.forEach(function(n){caches.delete(n)})})}}
</script>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="sun"></div>
    <div class="eyebrow">Carnet de voyage</div>
    <h1>Tenerife 🌋</h1>
    <div class="sub" id="subtitle">27 juin → 9 juillet 2026</div>
    <div class="countdown"><div class="big" id="cd-num">–</div><div class="lab" id="cd-lab">…</div></div>
  </header>

  <div class="searchbar">
    <div class="field"><span class="ico">🔎</span>
      <input id="search" type="search" placeholder="Rechercher un lieu, un resto, un jour…" autocomplete="off" autocapitalize="off">
    </div>
    <div class="results" id="results"></div>
  </div>

  <nav class="tabs">
    <button class="tab active" data-v="jours">📅 Jours</button>
    <button class="tab" data-v="forts">⭐ Forts</button>
    <button class="tab" data-v="pratique">🎒 Pratique</button>
    <button class="tab" data-v="carte">🗺️ Carte</button>
  </nav>

  <section class="view active" id="v-jours"></section>
  <section class="view" id="v-forts"></section>
  <section class="view" id="v-pratique"></section>
  <section class="view" id="v-carte"></section>

</div>

<script src="data.js?v=8"></script>
<script src="app.js?v=8"></script>
</body>
</html>

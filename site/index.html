<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Souvenirs de Vacances</title>
<meta name="description" content="Les souvenirs de vacances de la famille — choisis un voyage.">
<meta name="theme-color" content="#2AA6C9">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Souvenirs">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
<script>
if("serviceWorker" in navigator){navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(reg){reg.unregister()})});if(typeof caches!=="undefined"){caches.keys().then(function(k){k.forEach(function(n){caches.delete(n)})})}}
</script>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="sun"></div>
    <div class="eyebrow">Souvenirs de Vacances</div>
    <h1>Nos voyages 🧳</h1>
    <div class="sub">Choisis un voyage pour continuer</div>
  </header>

  <div class="trip-picker">
    <a class="trip-card" href="tenerife/index.html">
      <span class="tc-emoji">🌋</span>
      <span class="tc-title">Tenerife</span>
      <span class="tc-dates">27 juin → 9 juillet 2026</span>
    </a>
    <a class="trip-card" href="labaule/index.html">
      <span class="tc-emoji">🏖️</span>
      <span class="tc-title">La Baule</span>
      <span class="tc-dates">12 → 17 juillet 2026</span>
    </a>
  </div>

</div>
</body>
</html>

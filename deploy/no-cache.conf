# En-têtes cache au niveau http — empêche le cache navigateur (iOS Safari)
# de servir une version périmée du HTML/JS/CSS. Les photos (site/photos/)
# sont exclues : elles ont un id stable et ne changent jamais après publication,
# donc un cache long est sûr et indispensable pour un affichage fluide en 4G.
# À déposer dans /etc/nginx/conf.d/.
map $uri $cache_control {
    default                "no-cache, no-store, must-revalidate";
    ~*\.(webp|jpe?g|png)$  "public, max-age=31536000, immutable";
}
map $uri $pragma_header {
    default                "no-cache";
    ~*\.(webp|jpe?g|png)$  "";
}
add_header Cache-Control $cache_control always;
add_header Pragma $pragma_header always;

# Désactive le cache navigateur pour le site Tenerife.
# À inclure dans le bloc server{} ou location{} de nginx.
location / {
    root /var/www/html;
    index index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
}
